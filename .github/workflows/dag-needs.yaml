name: DAG needs block pipeline to run depend jobs

on:
  workflow_dispatch:

jobs:
  job-1:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "this job 1 will successs first"

  job-2:
    runs-on: ubuntu-22.04
    needs:
      - job-1
    steps:
      - run: echo "this job willonly trigger once job-1 is successful"

  job-3:
    runs-on: ubuntu-22.04
    needs:
      - job-1
      - job-2
    steps:
      - run: echo "this job willonly trigger once job-1 and job-2 is successful"
